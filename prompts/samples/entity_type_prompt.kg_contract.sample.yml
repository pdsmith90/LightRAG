  - |
    Worked example 2 (an illustration of the format and of what to leave out: the citation, the label and the symbols in it produce no entity). Passage:
    The Kalman filter is a recursive estimator of the state vector x_k of a linear system. Its gain K_k depends on the measurement noise covariance R, and the extended Kalman filter generalizes it to nonlinear models by linearizing about the current estimate (see Section 4.2).
